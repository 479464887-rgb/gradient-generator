        .header {

            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;

<body>
    <div class="header">
        <a href="https://479464887-rgb.github.io/devkit-site/">← DevKit Tools</a>
        <span style="color:var(--text-secondary);font-size:13px">Gradient Generator</span>
    </div>
    <div class="container">
        <h1>Gradient Generator</h1>
        <p class="subtitle">Create beautiful CSS gradients with live preview. Linear, radial, and conic gradients.</p>
        <div class="features">
            <span class="feature-tag">Linear / Radial / Conic modes</span>
            <span class="feature-tag">Color picker with opacity</span>
            <span class="feature-tag">Live preview</span>
            <span class="feature-tag">Copy CSS code</span>
        </div>
        <div class="card">
            <h2>Tool</h2>
            <div id="tool-area">
                
<div style="display:flex;gap:16px;flex-wrap:wrap;">
    <div style="flex:1;min-width:280px;">
        <label class="label">Type</label>
        <select id="grad-type"><option value="linear">Linear</option><option value="radial">Radial</option><option value="conic" selected>Conic</option></select>
        <div style="display:flex;gap:8px;margin-top:12px;">
            <div><label class="label">Color 1</label><input type="color" id="color1" value="#58a6ff" style="width:60px;height:40px;padding:2px;"></div>
            <div><label class="label">Color 2</label><input type="color" id="color2" value="#bc8cff" style="width:60px;height:40px;padding:2px;"></div>
            <div><label class="label">Color 3</label><input type="color" id="color3" value="#f778ba" style="width:60px;height:40px;padding:2px;"></div>
        </div>
        <label class="label" style="margin-top:12px;">Angle: <span id="angle-val">180°</span></label>
        <input type="range" id="angle" min="0" max="360" value="180" style="width:100%;">
    </div>
    <div style="flex:1;min-width:280px;">
        <label class="label">Preview</label>
        <div id="grad-preview" style="width:100%;height:200px;border-radius:var(--radius);border:1px solid var(--border);"></div>
    </div>
</div>
<label class="label" style="margin-top:16px;">CSS Code</label>
<textarea id="css-output" rows="2" readonly></textarea>
<button id="copy-css" style="margin-top:8px;">Copy CSS</button>

            <script>
'use strict';
const type = document.getElementById('grad-type');
const color1 = document.getElementById('color1');
const color2 = document.getElementById('color2');
const color3 = document.getElementById('color3');
const angle = document.getElementById('angle');
const angleVal = document.getElementById('angle-val');
const preview = document.getElementById('grad-preview');
const cssOutput = document.getElementById('css-output');

function update() {
    const t = type.value;
    const c1 = color1.value, c2 = color2.value, c3 = color3.value;
    const a = angle.value;
    angleVal.textContent = a + '\u00b0';
    
    let css;
    if (t === 'linear') {
        css = `linear-gradient(${a}deg, ${c1}, ${c2}${c3 ? ', ' + c3 : ''})`;
    } else if (t === 'radial') {
        css = `radial-gradient(circle, ${c1}, ${c2}${c3 ? ', ' + c3 : ''})`;
    } else {
        css = `conic-gradient(from ${a}deg, ${c1}, ${c2}${c3 ? ', ' + c3 : ''})`;
    }
    
    preview.style.background = css;
    cssOutput.value = `background: ${css};`;
}

[type, color1, color2, color3, angle].forEach(el => el.addEventListener('input', update));
document.getElementById('copy-css').addEventListener('click', () => {
    navigator.clipboard.writeText(cssOutput.value);
    const btn = document.getElementById('copy-css');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy CSS', 1500);
});
update();
</script>

    <script>
'use strict';
function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            var orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = orig, 1500);
        });
    }
</script>
